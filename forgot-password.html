<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासवर्ड रीसेट करा - QuickIDPrint</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #123a8f;
            --primary-hover: #0d2a6b;
            --secondary: #2563eb;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --dark: #0f172a;
            --slate-800: #1e293b;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --light-bg: #f8fafc;
            --card-border: #e2e8f0;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body {
            background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 50%, #fff7ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Top Minimal Bar */
        .top-nav {
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-section { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { height: 44px; width: auto; object-fit: contain; }
        .logo-box-fallback {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 20px; border: 1px solid #bfdbfe;
        }
        .logo-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; line-height: 1; }
        .logo-text h1 .brand-quick { color: var(--primary); }
        .logo-text h1 .brand-id { color: var(--accent); }
        .logo-text h1 .brand-print { color: var(--primary); }

        .back-home {
            font-size: 15px; font-weight: 700; color: var(--slate-600); text-decoration: none;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .back-home:hover { color: var(--primary); }

        /* Wrapper */
        .forgot-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .forgot-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px -10px rgba(18, 58, 143, 0.12);
            border: 1px solid var(--card-border);
            position: relative;
        }

        .forgot-header { text-align: center; margin-bottom: 28px; }
        .logo-header-img { max-height: 75px; margin-bottom: 12px; display: inline-block; }
        .forgot-icon-circle {
            width: 65px; height: 65px; border-radius: 20px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: var(--secondary); font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; border: 1px solid #bfdbfe;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.1);
        }
        .forgot-header h2 { font-size: 26px; font-weight: 800; color: var(--dark); margin-bottom: 6px; }
        .forgot-header p { font-size: 15px; color: var(--slate-600); font-weight: 600; line-height: 1.5; }

        /* Alert Notification Banner */
        .alert-box {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
            margin-bottom: 20px; display: none; align-items: center; gap: 10px;
        }
        .alert-box.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: flex; }
        .alert-box.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: flex; }

        /* Form Controls */
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; font-size: 14px; font-weight: 800; color: var(--slate-800);
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon-left {
            position: absolute; left: 16px; color: var(--slate-400); font-size: 16px;
        }
        .phone-prefix {
            position: absolute; left: 42px; font-weight: 800; color: var(--slate-800);
            font-size: 15px; user-select: none;
        }
        .form-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15.5px;
            font-weight: 600;
            color: var(--dark);
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
        }
        .form-input.phone-input {
            padding-left: 80px;
            letter-spacing: 0.5px;
        }
        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        /* Toggle Password Eye */
        .toggle-password {
            position: absolute; right: 16px; cursor: pointer; color: var(--slate-400);
            font-size: 16px; transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary); }

        .helper-text {
            font-size: 12px; color: var(--slate-600); margin-top: 5px; display: block;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            font-size: 17px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
            transition: all 0.25s;
            margin-top: 24px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
        }
        .btn-submit:disabled {
            opacity: 0.7; cursor: not-allowed; transform: none;
        }

        /* Back to Login Links */
        .links-row {
            margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--card-border);
            text-align: center; font-size: 15px; color: var(--slate-600); font-weight: 600;
        }
        .links-row a {
            color: var(--primary); font-weight: 800; text-decoration: none; margin-left: 5px;
        }
        .links-row a:hover { text-decoration: underline; }

        .forgot-footer {
            text-align: center; padding: 20px; color: var(--slate-400); font-size: 13px; font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="index.html" class="logo-section">
            <img src="logo.png" alt="QuickIDPrint" class="logo-img" onerror="this.style.display='none'; document.getElementById('topLogoBox').style.display='flex';">
            <div class="logo-box-fallback" id="topLogoBox" style="display: none;"><i class="fas fa-id-card"></i></div>
            <div class="logo-text">
                <h1><span class="brand-quick">Quick</span><span class="brand-id">ID</span><span class="brand-print">Print</span></h1>
            </div>
        </a>

        <a href="login.html" class="back-home">
            <i class="fas fa-arrow-left"></i> लॉगिनवर जा
        </a>
    </div>

    <!-- Center Card -->
    <div class="forgot-wrapper">
        <div class="forgot-card">
            
            <div class="forgot-header">
                <img src="logo.png" alt="QuickIDPrint Logo" class="logo-header-img" onerror="this.style.display='none'; document.getElementById('forgotIconFallback').style.display='flex';">
                
                <div class="forgot-icon-circle" id="forgotIconFallback" style="display: none;">
                    <i class="fas fa-key"></i>
                </div>
                <h2>पासवर्ड रीसेट करा</h2>
                <p>खाते सुरक्षित करण्यासाठी नोंदणीकृत मोबाईल व ईमेल व्हेरिफाय करा</p>
            </div>

            <!-- Dynamic Alert Message -->
            <div id="alertBox" class="alert-box">
                <i class="fas fa-circle-exclamation" id="alertIcon"></i>
                <span id="alertMsg">मेसेज</span>
            </div>

            <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
                
                <!-- 1. Registered Mobile Number -->
                <div class="form-group">
                    <label class="form-label" for="forgotMobile">
                        <i class="fas fa-mobile-screen" style="color: var(--secondary); margin-right: 5px;"></i> 
                        नोंदणीकृत मोबाईल नंबर
                    </label>
                    <div class="input-box">
                        <i class="fas fa-phone input-icon-left"></i>
                        <span class="phone-prefix">+91</span>
                        <input type="tel" id="forgotMobile" class="form-input phone-input" 
                               placeholder="98XXXXXXXX" maxlength="10" pattern="[0-9]{10}" 
                               required autofocus autocomplete="tel">
                    </div>
                </div>

                <!-- 2. Registered Email -->
                <div class="form-group">
                    <label class="form-label" for="forgotEmail">
                        <i class="fas fa-envelope" style="color: #dc2626; margin-right: 5px;"></i> 
                        नोंदणीकृत ईमेल आयडी
                    </label>
                    <div class="input-box">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="forgotEmail" class="form-input" 
                               placeholder="नोंदणी करताना दिलेला ईमेल" required autocomplete="email">
                    </div>
                    <span class="helper-text">सुरक्षेसाठी तुमचा रजिस्टर ईमेल आयडी आवश्यक आहे.</span>
                </div>

                <!-- 3. New Password -->
                <div class="form-group">
                    <label class="form-label" for="forgotNewPass">
                        <i class="fas fa-lock" style="color: var(--accent); margin-right: 5px;"></i> 
                        नवीन पासवर्ड सेट करा
                    </label>
                    <div class="input-box">
                        <i class="fas fa-key input-icon-left"></i>
                        <input type="password" id="forgotNewPass" class="form-input" 
                               placeholder="नवीन पासवर्ड टाका (किमान ४ अक्षरे)" minlength="4" required>
                        <i class="fas fa-eye toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-sync-alt"></i>
                    <span id="btnText">पासवर्ड अपडेट करा</span>
                </button>
            </form>

            <!-- Links Row -->
            <div class="links-row">
                पासवर्ड आठवला का? 
                <a href="login.html">येथे लॉगिन करा <i class="fas fa-arrow-right"></i></a>
            </div>

        </div>
    </div>

    <!-- Minimal Footer -->
    <div class="forgot-footer">
        &copy; 2026 QuickIDPrint. सर्व हक्क सुरक्षित. | सुरक्षित आणि एन्क्रिप्टेड रीसेट
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT CONNECTED TO RENDER BACKEND     -->
    <!-- ========================================== -->
    <script>
        // 🔗 तुमच्या Render बॅकएंडची लिंक
        const BACKEND_URL = "https://quickidprint-backend.onrender.com";

        // Password Show / Hide Toggle
        function togglePasswordVisibility() {
            const passInput = document.getElementById('forgotNewPass');
            const eyeIcon = document.getElementById('togglePassBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Alert Helper
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMsg');
            const alertIcon = document.getElementById('alertIcon');

            alertBox.className = `alert-box ${type}`;
            alertMsg.textContent = message;

            if (type === 'success') {
                alertIcon.className = 'fas fa-circle-check';
            } else {
                alertIcon.className = 'fas fa-circle-exclamation';
            }
            alertBox.style.display = 'flex';
        }

        // Forgot Password Submit Handler
        async function handleForgotSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            const mobile = document.getElementById('forgotMobile').value.trim();
            const email = document.getElementById('forgotEmail').value.trim();
            const newPassword = document.getElementById('forgotNewPass').value.trim();

            if (mobile.length !== 10) {
                showAlert('कृपया वैध १० अंकी मोबाईल नंबर टाका.');
                return;
            }

            // Button Loading State
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> तपासत आहे...';
            document.getElementById('alertBox').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('mobile', mobile);
                formData.append('email', email);
                formData.append('newPassword', newPassword);

                const response = await fetch(`${BACKEND_URL}/api/forgot-password`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showAlert('✅ ' + data.message + ' लॉगिन पेजवर नेले जात आहे...', 'success');

                    // २ सेकंदात लॉगिन पेजवर नेणे
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'पडताळणी अयशस्वी झाली. माहिती तपासा.');
                    submitBtn.disabled = false;
                    btnText.innerHTML = 'पासवर्ड अपडेट करा';
                }
            } catch (error) {
                console.error('Reset Error:', error);
                showAlert('सर्व्हरशी संपर्क होऊ शकला नाही. इंटरनेट तपासा किंवा १ मिनिटाने पुन्हा प्रयत्न करा.');
                submitBtn.disabled = false;
                btnText.innerHTML = 'पासवर्ड अपडेट करा';
            }
        }
    </script>
</body>
</html>
