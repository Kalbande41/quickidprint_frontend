<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नवीन नोंदणी - QuickIDPrint</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #123a8f;
            --primary-hover: #0d2a6b;
            --secondary: #2563eb;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --dark: #0f172a;
            --slate-800: #1e293b;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --light-bg: #f8fafc;
            --card-border: #e2e8f0;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body {
            background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 50%, #fff7ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Top Minimal Bar */
        .top-nav {
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-section { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { height: 44px; width: auto; object-fit: contain; }
        .logo-box-fallback {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 20px; border: 1px solid #bfdbfe;
        }
        .logo-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; line-height: 1; }
        .logo-text h1 .brand-quick { color: var(--primary); }
        .logo-text h1 .brand-id { color: var(--accent); }
        .logo-text h1 .brand-print { color: var(--primary); }

        .back-home {
            font-size: 15px; font-weight: 700; color: var(--slate-600); text-decoration: none;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .back-home:hover { color: var(--primary); }

        /* Register Form Wrapper */
        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 20px 40px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 620px;
            border-radius: 24px;
            padding: 35px 35px;
            box-shadow: 0 20px 40px -10px rgba(18, 58, 143, 0.12);
            border: 1px solid var(--card-border);
            position: relative;
        }

        .register-header { text-align: center; margin-bottom: 25px; }
        .logo-header-img {
            max-height: 80px; margin-bottom: 12px; display: inline-block;
        }
        .register-icon-circle {
            width: 58px; height: 58px; border-radius: 18px;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            color: var(--accent); font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; border: 1px solid #fed7aa;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
        }
        .register-header h2 { font-size: 26px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
        .register-header p { font-size: 15px; color: var(--slate-600); font-weight: 600; }

        /* Alert Notification Banner */
        .alert-box {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
            margin-bottom: 20px; display: none; align-items: center; gap: 10px;
        }
        .alert-box.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: flex; }
        .alert-box.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: flex; }

        /* Form Grid for 2-column layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-grid .full-col {
            grid-column: span 2;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 13.5px; font-weight: 800; color: var(--slate-800);
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon-left {
            position: absolute; left: 14px; color: var(--slate-400); font-size: 15px;
        }
        .phone-prefix {
            position: absolute; left: 38px; font-weight: 800; color: var(--slate-800);
            font-size: 14.5px; user-select: none;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
        }
        .form-input.phone-input {
            padding-left: 74px;
            letter-spacing: 0.5px;
        }
        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Password Show/Hide Toggle */
        .toggle-password {
            position: absolute; right: 14px; cursor: pointer; color: var(--slate-400);
            font-size: 15px; transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary); }

        .helper-text {
            font-size: 12px; color: var(--slate-600); margin-top: 4px; display: block;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #ea580c 100%);
            color: white;
            font-size: 17px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(249, 115, 22, 0.25);
            transition: all 0.25s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(249, 115, 22, 0.35);
        }
        .btn-submit:disabled {
            opacity: 0.7; cursor: not-allowed; transform: none;
        }

        /* Login Redirect */
        .login-redirect {
            margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--card-border);
            text-align: center; font-size: 15px; color: var(--slate-600); font-weight: 600;
        }
        .login-redirect a {
            color: var(--primary); font-weight: 800; text-decoration: none; margin-left: 5px;
        }
        .login-redirect a:hover { text-decoration: underline; }

        .register-footer {
            text-align: center; padding: 15px; color: var(--slate-400); font-size: 13px; font-weight: 600;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; gap: 0; }
            .form-grid .full-col { grid-column: span 1; }
            .register-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="index.html" class="logo-section">
            <img src="logo.png" alt="QuickIDPrint" class="logo-img" onerror="this.style.display='none'; document.getElementById('topLogoBox').style.display='flex';">
            <div class="logo-box-fallback" id="topLogoBox" style="display: none;"><i class="fas fa-id-card"></i></div>
            <div class="logo-text">
                <h1><span class="brand-quick">Quick</span><span class="brand-id">ID</span><span class="brand-print">Print</span></h1>
            </div>
        </a>

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i> होमपेजवर जा
        </a>
    </div>

    <!-- Register Container -->
    <div class="register-wrapper">
        <div class="register-card">
            
            <div class="register-header">
                <!-- If logo.png exists, show it centered; otherwise show icon circle -->
                <img src="logo.png" alt="QuickIDPrint Logo" class="logo-header-img" onerror="this.style.display='none'; document.getElementById('regIconFallback').style.display='flex';">
                
                <div class="register-icon-circle" id="regIconFallback" style="display: none;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>मोफत नवीन नोंदणी</h2>
                <p>पोर्टल वापरण्यासाठी तुमचे नवीन खाते त्वरित तयार करा</p>
            </div>

            <!-- Dynamic Alert Message -->
            <div id="alertBox" class="alert-box">
                <i class="fas fa-circle-exclamation" id="alertIcon"></i>
                <span id="alertMsg">मेसेज</span>
            </div>

            <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
                <div class="form-grid">
                    
                    <!-- 1. Full Name -->
                    <div class="form-group full-col">
                        <label class="form-label" for="regName">
                            <i class="fas fa-user" style="color: var(--secondary); margin-right: 4px;"></i> 
                            पूर्ण नाव *
                        </label>
                        <div class="input-box">
                            <i class="fas fa-user input-icon-left"></i>
                            <input type="text" id="regName" class="form-input" 
                                   placeholder="उदा. राहुल आनंदा शिंदे" required autofocus>
                        </div>
                    </div>

                    <!-- 2. Shop Name -->
                    <div class="form-group">
                        <label class="form-label" for="regShop">
                            <i class="fas fa-store" style="color: var(--accent); margin-right: 4px;"></i> 
                            शॉप / सेंटरचे नाव
                        </label>
                        <div class="input-box">
                            <i class="fas fa-shop input-icon-left"></i>
                            <input type="text" id="regShop" class="form-input" 
                                   placeholder="उदा. साई ऑनलाईन केंद्र">
                        </div>
                    </div>

                    <!-- 3. Address -->
                    <div class="form-group">
                        <label class="form-label" for="regAddress">
                            <i class="fas fa-location-dot" style="color: #16a34a; margin-right: 4px;"></i> 
                            पत्ता (गाव / शहर)
                        </label>
                        <div class="input-box">
                            <i class="fas fa-location-dot input-icon-left"></i>
                            <input type="text" id="regAddress" class="form-input" 
                                   placeholder="उदा. पुणे / बारामती">
                        </div>
                    </div>

                    <!-- 4. Mobile Number (Login ID) -->
                    <div class="form-group">
                        <label class="form-label" for="regMobile">
                            <i class="fas fa-mobile-screen" style="color: var(--secondary); margin-right: 4px;"></i> 
                            मोबाईल नंबर (हाच लॉगिन आयडी) *
                        </label>
                        <div class="input-box">
                            <i class="fas fa-phone input-icon-left"></i>
                            <span class="phone-prefix">+91</span>
                            <input type="tel" id="regMobile" class="form-input phone-input" 
                                   placeholder="98XXXXXXXX" maxlength="10" pattern="[0-9]{10}" required>
                        </div>
                    </div>

                    <!-- 5. Email (For Forgot Password) -->
                    <div class="form-group">
                        <label class="form-label" for="regEmail">
                            <i class="fas fa-envelope" style="color: #dc2626; margin-right: 4px;"></i> 
                            ईमेल आयडी (पासवर्डसाठी) *
                        </label>
                        <div class="input-box">
                            <i class="fas fa-envelope input-icon-left"></i>
                            <input type="email" id="regEmail" class="form-input" 
                                   placeholder="नाव@gmail.com" required>
                        </div>
                    </div>

                    <!-- 6. Password -->
                    <div class="form-group full-col">
                        <label class="form-label" for="regPassword">
                            <i class="fas fa-lock" style="color: var(--accent); margin-right: 4px;"></i> 
                            नवीन पासवर्ड ठेवा *
                        </label>
                        <div class="input-box">
                            <i class="fas fa-key input-icon-left"></i>
                            <input type="password" id="regPassword" class="form-input" 
                                   placeholder="किमान ६ अक्षरांचा मजबूत पासवर्ड" minlength="4" required>
                            <i class="fas fa-eye toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()"></i>
                        </div>
                        <span class="helper-text">हा पासवर्ड आणि तुमचा मोबाईल नंबर नेहमी लक्षात ठेवा.</span>
                    </div>

                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-user-check"></i>
                    <span id="btnText">खाते तयार करा</span>
                </button>
            </form>

            <!-- Login Prompt -->
            <div class="login-redirect">
                आधीच नोंदणी केली आहे का? 
                <a href="login.html">येथे लॉगिन करा <i class="fas fa-arrow-right"></i></a>
            </div>

        </div>
    </div>

    <!-- Minimal Footer -->
    <div class="register-footer">
        &copy; 2026 QuickIDPrint. सर्व हक्क सुरक्षित. | जलद • सोपे • विश्वासनीय
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT CONNECTED TO RENDER BACKEND     -->
    <!-- ========================================== -->
    <script>
        // 🔗 तुमच्या Render बॅकएंडची लिंक
        const BACKEND_URL = "https://quickidprint-backend.onrender.com";

        // Password Show / Hide Toggle
        function togglePasswordVisibility() {
            const passInput = document.getElementById('regPassword');
            const eyeIcon = document.getElementById('togglePassBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Alert Helper
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMsg');
            const alertIcon = document.getElementById('alertIcon');

            alertBox.className = `alert-box ${type}`;
            alertMsg.textContent = message;

            if (type === 'success') {
                alertIcon.className = 'fas fa-circle-check';
            } else {
                alertIcon.className = 'fas fa-circle-exclamation';
            }
            alertBox.style.display = 'flex';
        }

        // Register Form Submit Handler
        async function handleRegisterSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            const name = document.getElementById('regName').value.trim();
            const shop = document.getElementById('regShop').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (mobile.length !== 10) {
                showAlert('कृपया वैध १० अंकी मोबाईल नंबर टाका.');
                return;
            }

            // Button Loading State
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> नोंदणी करत आहे...';
            document.getElementById('alertBox').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('shopName', shop);
                formData.append('address', address);
                formData.append('mobile', mobile);
                formData.append('email', email);
                formData.append('password', password);

                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showAlert('🎉 ' + data.message + ' लॉगिन पेजवर नेले जात आहे...', 'success');

                    // २ सेकंदात लॉगिन पेजवर नेणे
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'नोंदणी अयशस्वी झाली. कृपया पुन्हा प्रयत्न करा.');
                    submitBtn.disabled = false;
                    btnText.innerHTML = 'खाते तयार करा';
                }
            } catch (error) {
                console.error('Registration Error:', error);
                showAlert('सर्व्हरशी संपर्क होऊ शकला नाही. इंटरनेट तपासा किंवा १ मिनिटाने पुन्हा प्रयत्न करा.');
                submitBtn.disabled = false;
                btnText.innerHTML = 'खाते तयार करा';
            }
        }
    </script>
</body>
</html>
